name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DNAX.slnx

      - name: Verify formatting
        run: dotnet format DNAX.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build DNAX.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DNAX.slnx --configuration Release --no-build --no-restore

      - name: Trim smoke test
        shell: pwsh
        # Publishes the MCPFab sample trimmed and asserts it still advertises tools and returns
        # complete payloads. Every trim failure in this stack is silent - a trimmed server with
        # zero tools, or a tool returning {} - so a build that merely succeeds proves nothing.
        run: ./eng/Verify-TrimSmoke.ps1

      - name: Pack
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath src -Filter *.csproj -Recurse | ForEach-Object {
            dotnet pack $_.FullName --configuration Release --no-build --output artifacts/packages
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify package isolation
        shell: pwsh
        run: ./eng/Verify-PackageDependencies.ps1

      - name: Collect binaries
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath src -Directory | ForEach-Object {
            $release = Join-Path $_.FullName 'bin/Release'
            if (Test-Path $release) {
              Copy-Item $release -Destination (Join-Path 'artifacts/bin' $_.Name) -Recurse
            }
          }

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dnax-dlls-${{ matrix.os }}
          path: artifacts/bin
          retention-days: 3

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dnax-nuget-packages
          retention-days: 1
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg

  publish-github-packages:
    needs: build-test-pack
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: dnax-nuget-packages
          path: packages

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "packages/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

  release:
    needs: [build-test-pack, publish-github-packages]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dnax-nuget-packages
          path: packages
      - name: Publish prerelease with reviewed notes and NuGet assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" packages/*.nupkg --verify-tag --prerelease \
            --title "DNA X ${RELEASE_TAG#v}" --notes-file "$notes"
