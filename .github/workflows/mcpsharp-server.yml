name: MCPFab server release

# Reusable release pipeline for MCPSharp servers. Replaces the per-repository copy of
# build-release-packages.yml, which was byte-identical across 18 repositories.
#
# Usage from a server repository (.github/workflows/release.yml):
#
#   name: Build Release Packages
#   on:
#     push:
#       tags: ["v*"]
#     workflow_dispatch:
#   jobs:
#     release:
#       uses: Wixely/DnaX/.github/workflows/mcpsharp-server.yml@main
#       with:
#         trim_policy: Trimmed
#       permissions:
#         contents: write
#         packages: write

on:
  workflow_call:
    inputs:
      project_name:
        description: "Server name. Defaults to the repository name."
        type: string
        required: false
        default: ""
      project_file:
        description: "Path to the server csproj. Defaults to <project_name>.csproj found in the tree."
        type: string
        required: false
        default: ""
      solution_file:
        description: "Path to the solution. Defaults to the first .sln or .slnx within two levels."
        type: string
        required: false
        default: ""
      dockerfile:
        description: "Dockerfile path. Defaults to ./Dockerfile."
        type: string
        required: false
        default: "./Dockerfile"
      trim_policy:
        description: "Trimmed, Analyzed, or Exempt. Trimmed publishes self-contained assets with PublishTrimmed."
        type: string
        required: false
        default: "Analyzed"
      dotnet_version:
        description: ".NET SDK version."
        type: string
        required: false
        default: "10.0.x"
      docker_platforms:
        type: string
        required: false
        default: "linux/amd64,linux/arm64"
    secrets:
      PACKAGES_TOKEN:
        description: >-
          Token with read:packages for the Wixely feed, where DnaX.MCPFab lives. Optional: the
          job token is used when it is absent, which works when the package grants this
          repository access. Callers pass `secrets: inherit`.
        required: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.runtime_id }} ${{ matrix.package_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_id: win-x64
            package_type: framework-dependent
            self_contained: false
          - runtime_id: linux-x64
            package_type: framework-dependent
            self_contained: false
          - runtime_id: win-x64
            package_type: self-contained
            self_contained: true
          - runtime_id: linux-x64
            package_type: self-contained
            self_contained: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Resolve build metadata
        shell: bash
        env:
          IN_PROJECT_NAME: ${{ inputs.project_name }}
          IN_PROJECT_FILE: ${{ inputs.project_file }}
          IN_SOLUTION_FILE: ${{ inputs.solution_file }}
        run: |
          set -euo pipefail
          project_name="${IN_PROJECT_NAME:-${GITHUB_REPOSITORY#*/}}"

          solution_file="${IN_SOLUTION_FILE}"
          if [[ -z "${solution_file}" ]]; then
            solution_file="$(find . -maxdepth 2 \( -name '*.slnx' -o -name '*.sln' \) | sort | head -n 1)"
          fi

          # Servers whose project is not <name>.csproj (for example PlaywrightMCPSharp,
          # which builds src/PlaywrightMCPSharp.Server) pass project_file explicitly
          # rather than relying on a special case baked into the shared pipeline.
          project_file="${IN_PROJECT_FILE}"
          if [[ -z "${project_file}" ]]; then
            project_file="$(find . -path '*/bin/*' -prune -o -path '*/obj/*' -prune -o -name "${project_name}.csproj" -print | sort | head -n 1)"
          fi

          if [[ -z "${solution_file}" || -z "${project_file}" ]]; then
            echo "Could not resolve solution/project. solution='${solution_file}' project='${project_file}'" >&2
            echo "Pass solution_file / project_file explicitly to the reusable workflow." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            package_version="${GITHUB_REF_NAME}"
          else
            package_version="dev-${GITHUB_RUN_NUMBER}"
          fi

          echo "PROJECT_NAME=${project_name}" >> "$GITHUB_ENV"
          echo "SOLUTION_FILE=${solution_file}" >> "$GITHUB_ENV"
          echo "PROJECT_FILE=${project_file}" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${package_version}" >> "$GITHUB_ENV"
          echo "PACKAGE_BASENAME=${project_name}-${{ matrix.runtime_id }}-${{ matrix.package_type }}" >> "$GITHUB_ENV"

      - name: Resolve trim flags
        shell: bash
        run: |
          set -euo pipefail
          # PublishTrimmed requires a self-contained publish, so the framework-dependent
          # legs are never trimmed regardless of policy.
          if [[ "${{ inputs.trim_policy }}" == "Trimmed" && "${{ matrix.self_contained }}" == "true" ]]; then
            echo "TRIM_ARGS=-p:PublishTrimmed=true" >> "$GITHUB_ENV"
          else
            echo "TRIM_ARGS=" >> "$GITHUB_ENV"
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Add Wixely feed credentials
        # DnaX.MCPFab lives on GitHub Packages, which requires authentication even for public
        # packages: without this, restore fails with NU1301 / 401 Unauthorized. The source name
        # must match the one in the repository's NuGet.config, because NuGet resolves
        # credentials by source name.
        run: >-
          dotnet nuget update source GitHub-Wixely-Packages
          --username ${{ github.actor }}
          --password "${{ secrets.PACKAGES_TOKEN || github.token }}"
          --store-password-in-clear-text
          --configfile NuGet.config

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" -c Release --no-restore

      - name: Test
        run: dotnet test "${{ env.SOLUTION_FILE }}" -c Release --no-build --verbosity normal

      - name: Publish
        run: >
          dotnet publish "${{ env.PROJECT_FILE }}"
          -c Release
          -r ${{ matrix.runtime_id }}
          --self-contained ${{ matrix.self_contained }}
          -o "publish/${{ matrix.runtime_id }}-${{ matrix.package_type }}"
          ${{ env.TRIM_ARGS }}
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=${{ matrix.self_contained }}
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:IsTransformWebConfigDisabled=true
          -p:StaticWebAssetsEnabled=false
          -p:DebugType=none
          -p:DebugSymbols=false

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd "publish/${{ matrix.runtime_id }}-${{ matrix.package_type }}"
          zip -r "../../${PACKAGE_BASENAME}-${PACKAGE_VERSION}.zip" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_BASENAME }}
          path: ${{ env.PACKAGE_BASENAME }}-${{ env.PACKAGE_VERSION }}.zip
          if-no-files-found: error

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Compute image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.docker_platforms }}
          # A BuildKit secret, not a build-arg: a build-arg would be recorded in the image
          # history. The Dockerfile mounts it only for the restore layer.
          secrets: |
            nuget_token=${{ secrets.PACKAGES_TOKEN || github.token }}
          build-args: |
            NUGET_USER=${{ github.actor }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish, docker]
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: ${{ github.event.repository.name }}-*

      - name: Show release assets
        shell: bash
        run: find release-assets -maxdepth 2 -type f | sort

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*/*.zip)
          if (( ${#assets[@]} == 0 )); then
            echo "No release ZIP assets found." >&2
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
